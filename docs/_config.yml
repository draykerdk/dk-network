# The Drayker documentation theme — one layout shared by every *.drayker.org site.
# Source: https://github.com/draykerdk/drayker-theme
remote_theme: draykerdk/drayker-theme

plugins:
  - jekyll-remote-theme
  - jekyll-optional-front-matter

title: Dk Network
description: The distributed network beneath the ecosystem, and the requirements it has to preserve.

dk_kicker: Network layer
dk_subdomain: dknetwork.drayker.org
dk_repo: https://github.com/draykerdk/dk-network

defaults:
  - scope:
      path: ""
    values:
      layout: default
